<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fake News Detection</title>
  <link rel="stylesheet" href="/style.css">

</head>
<body>
  <div class="wrapper">
    <header>
      <h1>📰 Fake News Detector</h1>
      <p class="subtitle">Paste an article below and check its authenticity</p>
    </header>

    <main class="card">
      <textarea id="news" placeholder="Paste news article here..."></textarea>
      <button onclick="checkNews()">🔍 Analyze</button>
      <p id="result"></p>
    </main>
  </div>

  <script>
    async function checkNews() {
      const text = document.getElementById("news").value;

      if (!text.trim()) {
        document.getElementById("result").innerText = "⚠️ Please enter some text.";
        return;
      }

      const response = await fetch("/api/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      const data = await response.json();
      document.getElementById("result").innerText =
        "✅ Prediction: " + data.prediction;
    }
  </script>
</body>
</html>
